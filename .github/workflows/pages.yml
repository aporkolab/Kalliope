name: Pages

# A böngészőbe fordított motor + a felület, backend nélkül.
# A kalliope-core-t a TeaVM JavaScriptre fordítja; a lap így hálózat nélkül
# elemez. A Docker-image ettől független marad — egy motorforrás, két kimenet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre egy deploy; a futó nem szakad meg, hogy félbevágott lap ne menjen ki.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A TeaVM a Maven saját JVM-jében fut, és az ASM-je nem olvassa a Java
      # 25-ös osztályfájlokat — ezért JDK 21. A motor 17-es bytecode-ra fordul,
      # tehát ez nem visz el nyelvi elemet.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kalliope-web/package-lock.json

      - name: Motor fordítása JavaScriptre
        run: ./mvnw -B -ntp -Pjs -pl kalliope-js -am package -DskipTests -Djacoco.skip=true

      # Ez a kapu: ha a lefordított motor bármiben másképp skandál, mint a JVM,
      # a deploy elbukik. Enélkül a webes változat csendben térhetne el.
      - name: Összevetés a JVM-motorral
        run: node kalliope-js/tools/js-diff.mjs

      - name: Felület építése
        working-directory: kalliope-web
        run: |
          npm ci
          npx ng build --base-href=/${{ github.event.repository.name }}/
          node tools/build-pages.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: kalliope-web/dist/kalliope-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url || steps.last.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url || steps.last.outputs.page_url }}
    # A deploy lépés többször elbukott GitHub-oldali 503-on ("No server is
    # currently available"), miközben a build és a js-diff kapu végig zöld
    # volt. Ez átmeneti hiba, nem a miénk — ezért kétszer újrapróbáljuk,
    # növekvő várakozással, és csak a harmadik bukás számít bukásnak.
    # Szándékosan nincs hozzá külön retry-action: nem hozunk be harmadik féltől
    # függőséget egy sleep meg egy if kedvéért.
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: |
          echo "A deploy elbukott (valószínűleg 503). Várok, és újrapróbálom."
          sleep 60
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: sleep 120
      - id: last
        if: steps.deploy.outcome == 'failure' && steps.retry.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Deploy utáni füstpróba: a KIÉLESÍTETT lapot tölti le, futtatja valódi
  # DOM-ban, és tényleg begépel egy verset.
  #
  # Se a unit tesztek, se a js-diff nem látja az összeszerelést: az egyik a
  # komponenst méri stubolt motorral, a másik a motort a JVM-hez. Ha a
  # build-pages.mjs nem fűzi be a motort a lapba, vagy a bundle el sem indul,
  # mindkettő zöld marad — és a lap mégis üres. Ez a próba a böngésző
  # szemszögéből nézi.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kalliope-web/package-lock.json
      - working-directory: kalliope-web
        run: npm ci
      - name: Füstpróba az élesített lapon
        working-directory: kalliope-web
        run: node tools/smoke-pages.mjs "${{ needs.deploy.outputs.page_url }}"
