name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (motor + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # A verify fázisba a Spotless és a JaCoCo lefedettségi küszöb is beköt —
      # a CI-nek nem kell tudnia a kapunk listáját, egy parancs az egész.
      - run: ./mvnw -B -ntp verify

  web:
    name: Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalliope-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: kalliope-web/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,css}"
      # A lefedettség és a 80%-os küszöb az angular.json + vitest-base.config.ts
      # párosban van bekötve, hogy a CI és a helyi futtatás ugyanazt mérje.
      - run: npx ng test --no-watch

  docker:
    name: Docker image
    needs: [java, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # A 4. build szakasz (JRE + AOT-tanítás) a célarchitektúrán fut, tehát az
      # arm64 változathoz emuláció kell. Az 1–3. szakasz $BUILDPLATFORM-on marad,
      # így a node- és a Maven-build nem emulálódik.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # PR-en csak épül, main-en publikál is: így bárki futtathatja
      # telepítés nélkül egyetlen docker run paranccsal.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Az image-et el is indítjuk, mielőtt bárhová kerülne. A JDK 26.0.2.1
      # AOT-gyorsítótára induláskor fatálisan összeomlott ("Unexpected exception
      # when loading aot-linked classes"), és ez zölden ment ki a GHCR-be, mert
      # a CI csak építette az image-et, futtatni sosem futtatta.
      - name: Füstpróba-image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kalliope:smoke
          cache-from: type=gha
      - name: Az image elindul és elemez
        run: |
          docker run -d --name smoke -p 8080:8080 kalliope:smoke
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/api/canon; then
              curl -fsS -H 'Content-Type: application/json' \
                -d '{"text":"Pásztori hangon zengtem a nyájat"}' \
                http://127.0.0.1:8080/api/analyze | grep -q '"scansion"'
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Enélkül csak a runner architektúrája (amd64) készül el, és a
          # publikált image Apple Siliconon el sem indul.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/kalliope:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
