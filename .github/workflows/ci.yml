name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (motor + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # A verify fázisba a Spotless és a JaCoCo lefedettségi küszöb is beköt —
      # a CI-nek nem kell tudnia a kapunk listáját, egy parancs az egész.
      - run: ./mvnw -B -ntp verify

  web:
    name: Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalliope-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kalliope-web/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,css}"
      # A lefedettség és a 80%-os küszöb az angular.json + vitest-base.config.ts
      # párosban van bekötve, hogy a CI és a helyi futtatás ugyanazt mérje.
      - run: npx ng test --no-watch

  docker:
    name: Docker image
    needs: [java, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # PR-en csak épül, main-en publikál is: így bárki futtathatja
      # telepítés nélkül egyetlen docker run paranccsal.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/kalliope:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
