spring:
  application:
    name: kalliope
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  # Az X-Forwarded-For-t a Tomcat RemoteIpValve dolgozza fel, és csak a
  # server.tomcat.remoteip.internal-proxies mintájára illő (alapból privát
  # címtartományú) proxytól fogadja el. A kérésszám-korlát erre épít.
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    whitelabel:
      enabled: false

logging:
  level:
    root: INFO
