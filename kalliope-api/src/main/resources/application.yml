spring:
  application:
    name: kalliope
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    whitelabel:
      enabled: false

logging:
  level:
    root: INFO
